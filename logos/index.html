<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>batonAI — opciones de logo</title>
<style>
  :root { --bg:#0e0e0e; --card:#171616; --line:#2a2a2a; --txt:#f2f2f2; --mut:#8d8d8d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:"Segoe UI", Inter, Helvetica, Arial, sans-serif; padding:56px 48px 72px; }
  header { max-width:1180px; margin:0 auto 40px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:-.02em; margin:0 0 8px; }
  header p { margin:0; color:var(--mut); font-size:14px; }
  .grid { max-width:1180px; margin:0 auto; display:grid;
          grid-template-columns:repeat(3, 1fr); gap:28px; }
  figure { margin:0; }
  .frame { background:var(--card); border:1px solid var(--line); border-radius:14px;
           overflow:hidden; aspect-ratio:1/1; display:flex; }
  .frame img { width:100%; height:100%; display:block; }
  figcaption { padding:14px 2px 0; }
  .num { color:var(--mut); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .name { font-size:15px; font-weight:600; margin:4px 0 4px; }
  .desc { font-size:13px; line-height:1.45; color:var(--mut); margin:0; }
</style>
</head>
<body>
<header>
  <h1>batonAI — opciones de logo</h1>
  <p>Seis conceptos, mismo lenguaje: blanco puro sobre #171616. SVG vectorial, escalable.</p>
</header>

<div class="grid">

  <figure>
    <div class="frame"><img src="batonai-01-senal.svg" alt="Opción 1"></div>
    <figcaption>
      <div class="num">01</div>
      <div class="name">Señal</div>
      <p class="desc">La batuta marca el compás y el gesto emite ondas: dirigir y avisar a la vez. La más cercana a tu logo actual, pero sin atril.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="batonai-02-orbita.svg" alt="Opción 2"></div>
    <figcaption>
      <div class="num">02</div>
      <div class="name">Órbita</div>
      <p class="desc">La batuta apunta al centro de un círculo: el punto de atención. Muy limpia, funciona a 16 px y como avatar.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="batonai-03-metronomo.svg" alt="Opción 3"></div>
    <figcaption>
      <div class="num">03</div>
      <div class="name">Metrónomo</div>
      <p class="desc">El compás que nunca se detiene: encendido permanente, ritmo constante. Silueta distinta al resto, muy legible en pequeño.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="batonai-04-enjambre.svg" alt="Opción 4"></div>
    <figcaption>
      <div class="num">04</div>
      <div class="name">Enjambre</div>
      <p class="desc">Un punto que reparte en tres: tú diriges, los agentes ejecutan. La que mejor cuenta el producto, no solo la metáfora musical.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="batonai-05-icono.svg" alt="Opción 5"></div>
    <figcaption>
      <div class="num">05</div>
      <div class="name">Icono</div>
      <p class="desc">Versión app-icon: cuadrado redondeado sólido con la batuta en negativo. Máximo contraste en pantalla y en la barra de tareas.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="batonai-06-logotipo.svg" alt="Opción 6"></div>
    <figcaption>
      <div class="num">06</div>
      <div class="name">Logotipo</div>
      <p class="desc">Lockup completo: marca mínima + “batonAI”. Para cabeceras, README y carcasa del panel.</p>
    </figcaption>
  </figure>

</div>
</body>
</html>
