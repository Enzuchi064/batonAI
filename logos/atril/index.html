<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>batonAI — atril + batuta (12 opciones)</title>
<style>
  :root { --bg:#0e0e0e; --card:#171616; --line:#2a2a2a; --txt:#f2f2f2; --mut:#8d8d8d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:"Segoe UI", Inter, Helvetica, Arial, sans-serif; padding:56px 48px 72px; }
  header { max-width:1180px; margin:0 auto 40px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:-.02em; margin:0 0 8px; }
  header p { margin:0; color:var(--mut); font-size:14px; }
  .grid { max-width:1180px; margin:0 auto; display:grid;
          grid-template-columns:repeat(3, 1fr); gap:28px; }
  figure { margin:0; }
  .frame { background:var(--card); border:1px solid var(--line); border-radius:14px;
           overflow:hidden; aspect-ratio:1/1; display:flex; }
  .frame img { width:100%; height:100%; display:block; }
  figcaption { padding:14px 2px 0; }
  .num { color:var(--mut); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .name { font-size:15px; font-weight:600; margin:4px 0 4px; }
  .desc { font-size:13px; line-height:1.45; color:var(--mut); margin:0; }
</style>
</head>
<body>
<header>
  <h1>batonAI — atril de director + batuta · 12 opciones</h1>
  <p>Ronda 1 (01–06) + ronda 2 (07–12). SVG vectorial, blanco sobre #171616.</p>
</header>

<div class="grid">

  <figure>
    <div class="frame"><img src="01-atril-clasico.svg" alt="Opción 1"></div>
    <figcaption>
      <div class="num">01</div>
      <div class="name">Atril clásico</div>
      <p class="desc">Perspectiva ligera, base elíptica y batuta con mango. La más equilibrada.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="02-atril-repisa.svg" alt="Opción 2"></div>
    <figcaption>
      <div class="num">02</div>
      <div class="name">Atril con repisa</div>
      <p class="desc">Borde inferior engrosado: sugiere la repisa donde apoya la partitura.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="03-atril-minimal.svg" alt="Opción 3"></div>
    <figcaption>
      <div class="num">03</div>
      <div class="name">Atril minimal</div>
      <p class="desc">Pie en T. La más limpia y la que mejor aguanta 16 px.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="04-atril-fino.svg" alt="Opción 4"></div>
    <figcaption>
      <div class="num">04</div>
      <div class="name">Atril fino</div>
      <p class="desc">Trazo de 8 px: más elegante en gran formato, más frágil en pequeño.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="05-icono.svg" alt="Opción 5"></div>
    <figcaption>
      <div class="num">05</div>
      <div class="name">Icono</div>
      <p class="desc">Atril en negativo dentro de cuadrado redondeado. App y favicon.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="06-lockup.svg" alt="Opción 6"></div>
    <figcaption>
      <div class="num">06</div>
      <div class="name">Lockup</div>
      <p class="desc">Símbolo + “batonAI” para README, cabecera y serigrafía.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="07-atril-partitura.svg" alt="Opción 7"></div>
    <figcaption>
      <div class="num">07</div>
      <div class="name">Partitura</div>
      <p class="desc">Cuatro líneas de partitura dentro del tablero. La más explícitamente musical; algo más de ruido.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="08-atril-tripode.svg" alt="Opción 8"></div>
    <figcaption>
      <div class="num">08</div>
      <div class="name">Trípode</div>
      <p class="desc">Tres patas en vez de base redonda. Más realista para un atril de director.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="09-atril-canto.svg" alt="Opción 9"></div>
    <figcaption>
      <div class="num">09</div>
      <div class="name">Canto</div>
      <p class="desc">El tablero gana grosor: se lee como objeto, no como pantalla. Coherente con el panel físico.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="10-atril-base-maciza.svg" alt="Opción 10"></div>
    <figcaption>
      <div class="num">10</div>
      <div class="name">Base maciza</div>
      <p class="desc">Sólido en la base y batuta más larga: equilibra el peso visual arriba y abajo.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="11-emblema.svg" alt="Opción 11"></div>
    <figcaption>
      <div class="num">11</div>
      <div class="name">Emblema</div>
      <p class="desc">Encerrado en un círculo. Formato sello: pegatina, llavero, camiseta, splash.</p>
    </figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="12-atril-ondas.svg" alt="Opción 12"></div>
    <figcaption>
      <div class="num">12</div>
      <div class="name">Ondas</div>
      <p class="desc">La batuta emite señal: atril + IA en un solo gesto. Más narrativa, menos clásica.</p>
    </figcaption>
  </figure>

</div>
</body>
</html>
